name: Ultimate Django CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: djangooo.settings
      PYTHONUNBUFFERED: 1

    steps:

    # ---------------- 1. Checkout code ----------------
    - name: Checkout code
      uses: actions/checkout@v3

    # ---------------- 2. Setup Python ----------------
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # ---------------- 3. Upgrade pip ----------------
    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    # ---------------- 4. Install dependencies ----------------
    - name: Install dependencies
      run: pip install -r djangooo/requirements.txt

    # ---------------- 5. Install dev tools ----------------
    - name: Install dev tools
      run: pip install flake8 pylint coverage bandit safety

    # ---------------- 6. Linting with flake8 ----------------
    - name: Lint apps flake8
      run: flake8 accounts articles --count --statistics --exit-zero

    # ---------------- 7. Static analysis pylint ----------------
    - name: Lint apps pylint
      run: pylint accounts articles --disable=R,C || true

    # ---------------- 8. Security analysis with bandit ----------------
    - name: Security static analysis
      run: bandit -r accounts articles -ll

    # ---------------- 9. Dependency vulnerability check ----------------
    - name: Safety check dependencies
      run: safety check

    # ---------------- 10. Django system check ----------------
    - name: Django system check
      run: python djangooo/manage.py check

    # ---------------- 11. Run unit tests accounts ----------------
    - name: Test Accounts app
      run: python djangooo/manage.py test accounts --verbosity=2

    # ---------------- 12. Run unit tests articles ----------------
    - name: Test Articles app
      run: python djangooo/manage.py test articles --verbosity=2

    # ---------------- 13. Test coverage ----------------
    - name: Measure coverage
      run: |
        coverage run --source='accounts,articles' djangooo/manage.py test
        coverage report -m
        coverage xml

    # ---------------- 14. Check for DEBUG=True ----------------
    - name: Prevent DEBUG=True
      run: |
        if grep -R "DEBUG = True" djangooo/settings.py; then
          echo "DEBUG mode is enabled in production!"
          exit 1
        fi

    # ---------------- 15. Secret key detection ----------------
    - name: Check for secrets
      run: |
        if grep -R "SECRET_KEY" djangooo/settings.py; then
          echo "Potential secret key leak!"
        fi

    # ---------------- 16. Build Docker image ----------------
    - name: Build Docker image
      run: docker build -t djangooo:latest djangooo/

    # ---------------- 17. Scan Docker image for vulnerabilities ----------------
    - name: Docker security scan
      run: docker scan djangooo:latest --accept-license || true

    # ---------------- 18. Run Django container ----------------
    - name: Run Django container
      run: |
        docker run -d -p 8000:8000 --name django_test djangooo:latest
        sleep 5

    # ---------------- 19. Health check container ----------------
    - name: Health check Django container
      run: docker exec django_test curl -f http://localhost:8000 || exit 1

    # ---------------- 20. Browser smoke test ----------------
    - name: Browser test with curl
      run: |
        curl -f http://localhost:8000/accounts/signup/ || exit 1
        curl -f http://localhost:8000/accounts/login/ || exit 1
        curl -f http://localhost:8000/articles/ || exit 1

    # ---------------- 21. Measure test execution time ----------------
    - name: Measure test time
      run: |
        start=$(date +%s)
        python djangooo/manage.py test
        end=$(date +%s)
        echo "Total test execution time: $((end-start)) seconds"

    # ---------------- 22. Deploy to staging server  ----------------
    - name: Deploy to staging
      run: echo "Deploying to staging server..."

    # ---------------- 23. Stop and remove container ----------------
    - name: Cleanup Docker
      run: |
        docker stop django_test
        docker rm django_test
        docker rmi djangooo:latest

    # ---------------- 24. Notify success ----------------
    - name: Notify CI/CD success
      run: echo "Pipeline completed successfully ✅"
